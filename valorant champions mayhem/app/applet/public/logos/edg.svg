<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Double Circle Background -->
  <circle cx="100" cy="100" r="94" fill="#0c0d10" stroke="#ffffff" stroke-width="6" />
  <circle cx="100" cy="100" r="80" fill="#0c0d10" stroke="#ffffff" stroke-width="3" />

  <!-- Arched top text: EDWARD GAMING -->
  <path id="edg-top-curve" d="M 40 100 A 60 60 0 0 1 160 100" fill="none" />
  <text font-family="'Rajdhani', sans-serif" font-weight="700" font-size="13.5" fill="#ffffff" letter-spacing="3.5">
    <textPath href="#edg-top-curve" startOffset="50%" text-anchor="middle">
      EDWARD GAMING
    </textPath>
  </text>

  <!-- Big Central EDG Typography -->
  <text x="100" y="118" text-anchor="middle" font-family="'Teko', sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
    EDG
  </text>

  <!-- Arched bottom text: INTERNATIONAL -->
  <path id="edg-bottom-curve" d="M 160 100 A 60 60 0 0 1 40 100" fill="none" />
  <text font-family="'Rajdhani', sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="4">
    <textPath href="#edg-bottom-curve" startOffset="50%" text-anchor="middle">
      INTERNATIONAL
    </textPath>
  </text>
</svg>
