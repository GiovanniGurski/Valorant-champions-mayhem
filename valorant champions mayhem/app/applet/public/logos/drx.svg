<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- DRX Blue X Motif -->
  <g fill="#2563eb">
    <!-- Main Center Diagonal Cross -->
    <polygon points="40,24 84,24 160,146 116,146" />
    <polygon points="160,24 116,24 40,146 84,146" />
  </g>

  <!-- White Striped Texture Accents on Wings -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="120" y1="36" x2="148" y2="36" />
    <line x1="128" y1="52" x2="156" y2="52" />
    <line x1="136" y1="68" x2="164" y2="68" />
    <line x1="44" y1="102" x2="72" y2="102" />
    <line x1="52" y1="118" x2="80" y2="118" />
    <line x1="60" y1="134" x2="88" y2="134" />
  </g>

  <!-- DRAGONX text -->
  <text x="100" y="180" text-anchor="middle" font-family="'Teko', sans-serif" font-weight="900" font-size="28" fill="#2563eb" letter-spacing="4">
    DRAGONX
  </text>
</svg>
